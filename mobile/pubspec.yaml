name: vendorsaathi_mobile
description: "VendorSaathi Mobile Application — Connecting local and mobile vendors with nearby customers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  http: ^1.2.1
  sqflite: ^2.3.2
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  geolocator: ^11.0.0
  url_launcher: ^6.3.0
  maplibre_gl: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
