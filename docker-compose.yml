services:
  postgres:
    image: postgres:16-alpine
    container_name: vendorsaathi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vendorsaathi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendorsaathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendorsaathi-api
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/vendorsaathi?sslmode=disable"
      LOG_LEVEL: "debug"
      JWT_SIGNING_KEY: "your-super-secret-signing-key-change-in-production-min-32-chars"
      JWT_ISSUER: "vendorsaathi"
      JWT_AUDIENCE: "vendorsaathi-api"
      JWT_ACCESS_TOKEN_TTL: "15m"
      JWT_REFRESH_TOKEN_TTL: "720h"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8080"]'
      MAP_PROVIDER: "openfreemap"
      MAP_STYLE_URL: "https://tiles.openfreemap.org/styles/liberty"
      MAP_ATTRIBUTION: "© OpenFreeMap © OpenMapTiles © OpenStreetMap contributors"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # config.yaml is optional — all required values are provided via environment
    # variables above. Uncomment the bind mount below if you want to supply
    # a local config.yaml instead (copy config.yaml.example to config.yaml first).
    #volumes:
    #  - ./config.yaml:/app/config.yaml:ro

  minio:
    # Use the official Bitnami MinIO image which is reliably available and
    # well-maintained. It is a drop-in replacement for the upstream image.
    image: bitnami/minio:latest
    container_name: vendorsaathi-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
